{{- if .Values.controller.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "lcs.fullname" . }}-test-connection"
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- include "lcs.podSecurityContext" 1001 | nindent 4 }}
  containers:
    - name: wget
      image: "{{ .Values.global.waitImage.repository }}:{{ .Values.global.waitImage.tag }}"
      command: ["sh", "-c"]
      args:
        - |
          curl -sf http://controller:4002/healthz || exit 1
      securityContext:
        {{- include "lcs.containerSecurityContext" 1001 | nindent 8 }}
{{- end }}
