{{- if .Values.amfProxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amf-proxy
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
    app.kubernetes.io/name: amf-proxy
spec:
  replicas: {{ .Values.amfProxy.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: amf-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amf-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
        env: {{ .Values.global.env }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: amf-proxy
          image: {{ include "lcs.image" (dict "root" . "repo" .Values.amfProxy.image.repository "tag" .Values.amfProxy.image.tag "digest" .Values.amfProxy.image.digest) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8082
          env:
            {{- range $k, $v := .Values.amfProxy.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /sessions
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /sessions
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.amfProxy.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: amf-proxy
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
    app.kubernetes.io/name: amf-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: amf-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8082
      targetPort: http
{{- end }}
