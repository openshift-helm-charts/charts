{{- if .Values.lmfPe.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: lmf-pe-config
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
    app.kubernetes.io/name: lmf-pe
data:
  config.yaml: |
    {{- .Values.lmfPe.config | toYaml | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lmf-pe
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
    app.kubernetes.io/name: lmf-pe
spec:
  replicas: {{ .Values.lmfPe.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lmf-pe
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lmf-pe
        app.kubernetes.io/instance: {{ .Release.Name }}
        env: {{ .Values.global.env }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "lcs.podSecurityContext" . | nindent 8 }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.global.waitForLoki }}
      initContainers:
        - name: wait-for-dependencies
          image: "{{ .Values.global.waitImage.repository }}:{{ .Values.global.waitImage.tag }}"
          securityContext:
            {{- include "lcs.containerSecurityContext" . | nindent 12 }}
          command:
            - bash
            - -ec
            - |
              host="${LOKI_SERVICE_HOST:-loki}"
              port="${LOKI_SERVICE_PORT:-3100}"
              echo "waiting for loki at ${host}:${port}"
              until (echo >/dev/tcp/"$host"/"$port") >/dev/null 2>&1; do
                echo "still waiting for loki at ${host}:${port}"
                sleep 2
              done
              echo "loki is reachable"
      {{- end }}
      containers:
        - name: lmf-pe
          image: {{ include "lcs.image" (dict "root" . "repo" .Values.lmfPe.image.repository "tag" .Values.lmfPe.image.tag "digest" .Values.lmfPe.image.digest) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "lcs.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: nlmf
              containerPort: 8080
            - name: namf
              containerPort: 8081
            - name: maint
              containerPort: 8888
            - name: metrics
              containerPort: 9878
          env:
            {{- range $k, $v := .Values.lmfPe.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /usr/lib/lmf_pe/etc/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: logs
              mountPath: /var/log/lmf_pe
          startupProbe:
            httpGet:
              path: /readyz
              port: maint
            failureThreshold: 24
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: maint
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: maint
            periodSeconds: 20
          resources:
            {{- toYaml .Values.lmfPe.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: lmf-pe-config
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lmf-pe
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
    app.kubernetes.io/name: lmf-pe
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lmf-pe
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: nlmf
      port: 8080
      targetPort: nlmf
    - name: namf
      port: 8081
      targetPort: namf
    - name: maint
      port: 8888
      targetPort: maint
    - name: metrics
      port: 9878
      targetPort: metrics
{{- if and .Values.lmfPe.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lmf-pe
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
    app.kubernetes.io/name: lmf-pe
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lmf-pe
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: {{ .Values.lmfPe.serviceMonitor.port }}
      path: {{ .Values.lmfPe.serviceMonitor.path }}
      interval: 30s
{{- end }}
{{- end }}
