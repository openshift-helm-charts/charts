{{- if .Values.zpsLight.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zps-light
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
    app.kubernetes.io/name: zps-light
spec:
  replicas: {{ .Values.zpsLight.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zps-light
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zps-light
        app.kubernetes.io/instance: {{ .Release.Name }}
        env: {{ .Values.global.env }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: zps-light
          image: {{ include "lcs.image" (dict "root" . "repo" .Values.zpsLight.image.repository "tag" .Values.zpsLight.image.tag "digest" .Values.zpsLight.image.digest) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 9094
            - name: ws
              containerPort: 9095
          envFrom:
            - secretRef:
                name: {{ .Values.externalSecret.targetSecretName }}
          env:
            {{- range $k, $v := .Values.zpsLight.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.zpsLight.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: zps-light
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
    app.kubernetes.io/name: zps-light
  {{- if .Values.zpsLight.service.nlb.enabled }}
  annotations:
    {{- toYaml .Values.zpsLight.service.nlb.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ if .Values.zpsLight.service.nlb.enabled }}LoadBalancer{{ else }}{{ .Values.zpsLight.service.type }}{{ end }}
  selector:
    app.kubernetes.io/name: zps-light
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 9094
      targetPort: http
    - name: ws
      port: 9095
      targetPort: ws
{{- end }}
