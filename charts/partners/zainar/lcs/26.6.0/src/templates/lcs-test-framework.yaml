{{- if .Values.lcsTestFramework.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: lcs-test-framework-config
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
    app.kubernetes.io/name: lcs-test-framework
data:
  config.json: |
    {{- .Values.lcsTestFramework.config | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lcs-test-framework
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
    app.kubernetes.io/name: lcs-test-framework
spec:
  replicas: {{ .Values.lcsTestFramework.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: lcs-test-framework
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lcs-test-framework
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: lcs-test-framework
          image: {{ include "lcs.image" (dict "root" . "repo" .Values.lcsTestFramework.image.repository "tag" .Values.lcsTestFramework.image.tag "digest" .Values.lcsTestFramework.image.digest) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: amf
              containerPort: 9000
            - name: gmlc
              containerPort: 9001
          env:
            {{- range $k, $v := .Values.lcsTestFramework.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /tmp/lcs-test-framework.json
              subPath: config.json
              readOnly: true
            - name: logs
              mountPath: /tmp/lcs_test_framework
          resources:
            {{- toYaml .Values.lcsTestFramework.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: lcs-test-framework-config
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lcs-test-framework
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
    app.kubernetes.io/name: lcs-test-framework
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lcs-test-framework
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: amf
      port: 9000
      targetPort: amf
    - name: gmlc
      port: 9001
      targetPort: gmlc
{{- end }}
