{{- if .Values.networkPolicy.enabled }}
# :4004 internal endpoint — only zps-light may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-internal-4004
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: controller
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    # Allow all other controller ports from in-namespace (refine later with default-deny).
    - ports:
        - protocol: TCP
          port: 4000
        - protocol: TCP
          port: 4001
        - protocol: TCP
          port: 4002
        - protocol: TCP
          port: 4003
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zps-light
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 4004
{{- end }}
