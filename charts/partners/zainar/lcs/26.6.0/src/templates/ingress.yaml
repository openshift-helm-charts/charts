{{- if and .Values.controller.enabled .Values.controller.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: controller
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.controller.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.controller.ingress.className }}
  rules:
    - host: {{ .Values.controller.ingress.hosts.api }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: controller
                port:
                  number: 4000
    - host: {{ .Values.controller.ingress.hosts.manager }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: controller
                port:
                  number: 4003
{{- end }}
