{{- if .Values.zpsLight.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zps-light
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
    app.kubernetes.io/name: zps-light
spec:
  replicas: {{ .Values.zpsLight.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zps-light
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zps-light
        app.kubernetes.io/instance: {{ .Release.Name }}
        env: {{ .Values.global.env }}
    spec:
      {{- include "lcs.podIdentity" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "lcs.podSecurityContext" . | nindent 8 }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: zps-light
          image: {{ include "lcs.image" (dict "root" . "repo" .Values.zpsLight.image.repository "tag" .Values.zpsLight.image.tag "digest" .Values.zpsLight.image.digest) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "lcs.containerSecurityContext" . | nindent 12 }}
          {{- include "lcs.terminationMessagePolicy" . | nindent 10 }}
          {{- include "lcs.containerLifecycle" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 9094
            - name: tcp-ws
              containerPort: 9095
          envFrom:
            - secretRef:
                name: {{ .Values.externalSecret.targetSecretName }}
          env:
            {{- range $k, $v := .Values.zpsLight.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            {{- include "lcs.tmpVolumeMount" . | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 24
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.zpsLight.resources | nindent 12 }}
      volumes:
        {{- include "lcs.tmpVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: zps-light
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
    app.kubernetes.io/name: zps-light
  {{- if .Values.zpsLight.service.nlb.enabled }}
  annotations:
    {{- toYaml .Values.zpsLight.service.nlb.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ if .Values.zpsLight.service.nlb.enabled }}LoadBalancer{{ else }}{{ .Values.zpsLight.service.type }}{{ end }}
  {{- include "lcs.serviceDualStack" . | nindent 2 }}
  selector:
    app.kubernetes.io/name: zps-light
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 9094
      targetPort: http
    - name: tcp-ws
      port: 9095
      targetPort: tcp-ws
{{- end }}
