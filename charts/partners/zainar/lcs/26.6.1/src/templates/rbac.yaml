{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lcs.serviceAccountName" . }}
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lcs.serviceAccountName" . }}
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "lcs.serviceAccountName" . }}
  labels:
    {{- include "lcs.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "lcs.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "lcs.serviceAccountName" . }}
{{- end }}
