event_route[htable:mod-init] {
        xlog("L_INFO", "**********************************************************************");
        xlog("L_INFO", "$C(yb)*** Kamailio starting!$C(xx)\n");
        xlog("L_INFO", "   $cfg(name)");
}

#Default message handler

request_route {
    # Basic sanity checks
    if (!mf_process_maxfwd_header("10")) {
        send_reply("483", "Too Many Hops");
        exit;
    }

    if (is_method("OPTIONS")) {
        send_reply("200", "OK");
        exit;
    }

    if (is_method("ACK")) {
        xlog("L_INFO", "ACK received service=!OTEL_SERVICE_NAME! callid=$ci src=$si:$sp ruri=$ru du=$du route=[$hdr(Route)] cseq=[$hdr(CSeq)]\n");
    }

    # Record-Route all requests to stay in the path
    if (is_method("INVITE|SUBSCRIBE|REFER|UPDATE|MESSAGE")) {
        record_route();
    }

    # Handle in-dialog requests
    if (has_totag()) {
      if (loose_route()) {
        if (is_method("BYE")) {
          setflag(1);          
          setflag(2);        
          setflag(3);
        }
        if (is_method("ACK")) {
          xlog("L_INFO", "ACK loose_route service=!OTEL_SERVICE_NAME! callid=$ci src=$si:$sp ruri=$ru du=$du route=[$hdr(Route)]\n");
        }
        route(TRACE_CONTEXT);
        route(RELAY);
        exit;
      }

      # ACK to non-2xx final responses is transaction-bound. Relay it only if
      # Kamailio still has the matching transaction; otherwise drop silently.
      if (is_method("ACK")) {
        if (t_check_trans()) {
          xlog("L_INFO", "ACK transaction-match service=!OTEL_SERVICE_NAME! callid=$ci src=$si:$sp ruri=$ru du=$du route=[$hdr(Route)]\n");
          route(TRACE_CONTEXT);
          route(RELAY);
        }
        xlog("L_WARN", "ACK dropped no-route-no-transaction service=!OTEL_SERVICE_NAME! callid=$ci src=$si:$sp ruri=$ru du=$du route=[$hdr(Route)]\n");
        exit;
      }

      # Non-ACK in-dialog requests without a valid Route header should not be
      # guessed through the dispatcher fallback.
      send_reply("404", "Not here");
      exit;
    }

    # ====== Initial INVITE handling ======
    if (is_method("INVITE")) {
        $dlg_var(callid) = $ci;    # Call-ID
        $dlg_var(correlation_id) = $ci;

        if (is_present_hf("traceparent")) {
            $dlg_var(traceparent) = $hdr(traceparent);
        }
        if (is_present_hf("tracestate")) {
            $dlg_var(tracestate) = $hdr(tracestate);
        }
        if (is_present_hf("baggage")) {
            $dlg_var(baggage) = $hdr(baggage);
        }

        if (is_present_hf("Diversion")) {
            $var(hdr) = $hdr(Diversion);
            xlog("L_INFO", "Here o: $var(hdr)\n");
            $var(mid) = $(var(hdr){s.select,0,<});
            xlog("L_INFO", "Here 1: $var(mid)\n");
            $var(mid) = $(var(mid){s.select,1,>});
            xlog("L_INFO", "Here_2: $var(mid)\n");
            $var(mid) = $(var(hdr){s.substr,5,12});
            xlog("L_INFO", "Here_3: $var(mid)\n");
            $rU = $var(mid);
            xlog("L_INFO", "Inbound call to OPTUS Diversion user: $rU\n");
        } else {
          if (is_present_hf("History-Info")) {
              xlog("L_INFO", "History user\n");
                $var(hdr) = $hdr(History-Info);   
                $var(p) = $(var(hdr){s.substr,1,0});
                $var(q) =  $(var(p){s.select,0,>});
                $rU = $(var(q){uri.user});
                xlog("L_INFO", "Inbound call to OPTUS History user : $rU\n");
            };
        } 
        dlg_manage();        # Track dialog for BYE matching
        setflag(1);          # acc table logging
        setflag(2);          # cdr_flag for acc_cdr table
        dlg_setflag(4);      # mark dialog with a flag
        $dlg_var(caller) = $fU;    # From username
        $dlg_var(callee) = $tU;    # To username
        route(TRACE_CONTEXT);
        xlog("L_INFO", "{\"bridge\":\"kamailio-trace\",\"event\":\"sip_ingress\",\"service\":\"!OTEL_SERVICE_NAME!\",\"method\":\"$rm\",\"call_id\":\"$ci\",\"correlation_id\":\"$dlg_var(correlation_id)\",\"traceparent\":\"$dlg_var(traceparent)\",\"from_user\":\"$fU\",\"to_user\":\"$tU\",\"src_ip\":\"$si\"}\n");
        # Select upstream via dispatcher set 1 using hash over Call-ID (algo 4)
        if (!ds_select_dst(1, 4)) {
            send_reply("500", "No available gateways");
            exit;
        }
        # Persist chosen destination for dialog
        $dlg_var(fs_du) = $du;
        xlog("L_INFO", "dispatcher selected dst for dialog: fs_du=$dlg_var(fs_du) callid=$ci\n");
        route(RELAY);
        exit;
    }

    # Relay the request
    route(TRACE_CONTEXT);
    route(RELAY);
}

route[TRACE_CONTEXT] {
    if (!is_present_hf("X-Correlation-ID")) {
        append_hf("X-Correlation-ID: $ci\r\n");
    }

    if (!is_present_hf("X-OTel-Service")) {
        append_hf("X-OTel-Service: !OTEL_SERVICE_NAME!\r\n");
    }

    if (!is_present_hf("traceparent") && $dlg_var(traceparent) != $null && $dlg_var(traceparent) != "") {
        append_hf("traceparent: $dlg_var(traceparent)\r\n");
    }

    if (!is_present_hf("tracestate") && $dlg_var(tracestate) != $null && $dlg_var(tracestate) != "") {
        append_hf("tracestate: $dlg_var(tracestate)\r\n");
    }

    if (!is_present_hf("baggage") && $dlg_var(baggage) != $null && $dlg_var(baggage) != "") {
        append_hf("baggage: $dlg_var(baggage)\r\n");
    }

    if (is_method("INVITE|BYE|ACK|CANCEL")) {
        xlog("L_INFO", "{\"bridge\":\"kamailio-trace\",\"event\":\"sip_relay\",\"service\":\"!OTEL_SERVICE_NAME!\",\"method\":\"$rm\",\"call_id\":\"$ci\",\"correlation_id\":\"$hdr(X-Correlation-ID)\",\"traceparent\":\"$hdr(traceparent)\",\"from_user\":\"$fU\",\"to_user\":\"$tU\",\"dst_uri\":\"$du\",\"ruri\":\"$ru\"}\n");
    }
}

route[RELAY] {
    if (is_method("ACK")) {
        xlog("L_INFO", "ACK relay-attempt service=!OTEL_SERVICE_NAME! callid=$ci src=$si:$sp ruri=$ru du=$du route=[$hdr(Route)]\n");
    }
    if (!t_relay()) {
        if (is_method("ACK")) {
            xlog("L_ERR", "ACK relay-failed service=!OTEL_SERVICE_NAME! callid=$ci src=$si:$sp ruri=$ru du=$du route=[$hdr(Route)]\n");
        } else {
            send_reply("500", "Internal Error");
        }
    }
    exit;
}

# Handle HTTP requests for JSONRPC and basic health
event_route[xhttp:request] {
    if ($hu =~ "^/RPC") {
        jsonrpc_dispatch();
        exit;
    }
    if ($hu == "/healthz") {
        send_reply("200", "OK");
        exit;
    }
    xlog("L_INFO", "xhttp request to $hu from $si\n");
    send_reply("403", "Forbidden");
    exit;
}
