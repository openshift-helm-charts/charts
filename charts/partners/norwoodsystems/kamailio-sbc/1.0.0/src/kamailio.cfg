# CONFIG FILE for kamailio-sbc
#
# Custom cfg variables
#
local.debugmb = 0 desc "Log message buffer on entering main routes"
local.debugrt = 0 desc "Log route name on entering routes"
local.debuglogic = 1 desc "Log logic info"
local.var_limit = 2 desc "Max number of concurrent calls per user"


#!defenv MYIP
#!substdef "/!MYIP!/$env(MYIP)/"
# Kamailio_IP will be replaced with the value from  MYIP
listen=udp:0.0.0.0:5060 advertise "!MYIP!":5060
listen=tcp:0.0.0.0:5060 advertise "!MYIP!":5060
listen=tcp:0.0.0.0:5061 advertise "!MYIP!":5061
listen=tcp:0.0.0.0:5065 advertise "!MYIP!":5065
listen=tcp:0.0.0.0:8033 advertise "!MYIP!":8033
alias="!MYIP!":5060
alias="!MYIP!":5061
alias="!MYIP!":5065
alias="!MYIP!":8033

fork=yes
auto_aliases=no

#Logging:
debug=2
log_stderror=no
# Note: LOG_LOCAL0 refers to an entry (typically) in /etc/rsyslog.d/50-default.conf
log_facility=LOG_LOCAL0

disable_tcp=no
tcp_connection_lifetime=630

#Configure TCP keepalive:
tcp_crlf_ping = yes
tcp_keepalive = no
tcp_keepcnt = 6
tcp_keepidle = 60
tcp_keepintvl = 60

disable_core_dump=yes

#noisy feedback
sip_warning=0

#!define WITH_PGSQL
