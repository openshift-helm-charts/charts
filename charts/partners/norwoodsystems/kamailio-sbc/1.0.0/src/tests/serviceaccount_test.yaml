suite: ServiceAccount tests
templates:
  - templates/serviceaccount.yaml
values:
  - ../values.yaml
tests:
  - it: should create ServiceAccount by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: should not render when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
