apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kamailio-sbc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kamailio-sbc.labels" . | nindent 4 }}
data:
  {{- $myIpSource := default "config" .Values.advertiseAddress.source }}
  {{- range $key, $value := .Values.config }}
  {{- if not (and (eq $myIpSource "podIP") (eq $key "MYIP")) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
