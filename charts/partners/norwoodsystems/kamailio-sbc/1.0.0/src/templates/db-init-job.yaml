{{- if .Values.dbInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kamailio-sbc.fullname" . }}-db-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kamailio-sbc.labels" . | nindent 4 }}
  annotations:
    # Ensure DB ownership/privileges are set BEFORE the Deployment starts
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "kamailio-sbc.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "kamailio-sbc.serviceAccountName" . }}
      {{- with .Values.dbInit.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: db-init
          image: {{ printf "%s:%s" .Values.dbInit.image.repository .Values.dbInit.image.tag | quote }}
          imagePullPolicy: {{ .Values.dbInit.image.pullPolicy }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "dbInit.superuserSecretName is required when dbInit.enabled=true" .Values.dbInit.superuserSecretName }}
                  key: {{ .Values.dbInit.superuserSecretKey | default "password" }}
          command:
            - sh
            - -ec
            - |
              set -euo pipefail
              PSQL="psql -h {{ .Values.dbInit.host | default .Values.config.DBHOST }} -p {{ .Values.dbInit.port | default .Values.config.DBPORT }} -U postgres -d postgres -v ON_ERROR_STOP=1 -X -q"
              echo "Preparing database {{ .Values.config.DBNAME }} on host {{ .Values.dbInit.host | default .Values.config.DBHOST }}..."
              {{- if .Values.dbInit.dropAndRecreate }}
              if $PSQL -tAc "SELECT 1 FROM pg_database WHERE datname='{{ .Values.config.DBNAME }}'" | grep -q 1; then
                echo "Dropping existing database {{ .Values.config.DBNAME }} (terminating active sessions first)..."
                $PSQL -c "REVOKE CONNECT ON DATABASE \"{{ .Values.config.DBNAME }}\" FROM PUBLIC;"
                $PSQL -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='{{ .Values.config.DBNAME }}';"
                $PSQL -c "DROP DATABASE \"{{ .Values.config.DBNAME }}\";"
              fi
              {{- end }}
              if ! $PSQL -tAc "SELECT 1 FROM pg_database WHERE datname='{{ .Values.config.DBNAME }}'" | grep -q 1; then
                echo "Creating database {{ .Values.config.DBNAME }} owned by {{ .Values.config.DBUSER }}..."
                $PSQL -c "CREATE DATABASE \"{{ .Values.config.DBNAME }}\" OWNER \"{{ .Values.config.DBUSER }}\";"
              fi
              echo "Ensuring privileges..."
              $PSQL -c "GRANT CONNECT ON DATABASE \"{{ .Values.config.DBNAME }}\" TO \"{{ .Values.config.DBUSER }}\";"
              {{- if .Values.dbInit.grantCreateDb }}
              $PSQL -c "ALTER ROLE \"{{ .Values.config.DBUSER }}\" CREATEDB;"
              {{- end }}
{{- end }}
